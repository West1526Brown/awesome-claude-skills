<!-- Add these tags inside <head>. -->

<!-- Web app manifest (required for Android installability) -->
<link rel="manifest" href="/manifest.webmanifest" />

<!-- Address-bar / theme color on Android Chrome -->
<meta name="theme-color" content="#0b5fff" />

<!-- Responsive viewport (required for a good mobile/standalone experience) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- Cross-platform niceties: iOS / Safari home-screen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MyApp" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />

<!-- Standard favicon -->
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
